<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickord | Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #36393f;
        }

        .hidden {
            display: none !important;
        }

        .shake-animation {
            animation: shake 0.3s infinite;
            border: 2px solid #ff4d4d;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            50% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1000;
            background-color: #36393f;
        }
        #loadingScreen img {
            width: 128px;
            height: 128px;
            animation: rotate 2s ease-in-out infinite;
        }

        #loadingScreen.fade-out {
            animation: fadeOut 0.5s forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        #main {
            margin: 0;
            padding: 0;
            background-color: #36393f;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .channels, .chat, .users {
            padding: 15px;
            overflow-y: auto;
        }
        .channels {
            width: 20%;
            background-color: #2f3136;
            display: flex;
            flex-direction: column;
        }
        .channels h2 {
            margin: 0 0 20px 0;
            font-size: 1.2em;
            color: #b9bbbe;
        }
        .channel {
            display: flex;
            align-items: center;
            position: relative;
        }
        .channel > .name {
            font-size: 1em;
            font-weight: 700;
            flex:1;
        }
        .channel > .icon {
            margin-right: 6px;
        }
        .channel > .icon > svg {
            width: 20px;
            height: 20px;
        }

        .channel.active {
            background-color: #7289da;
            font-weight: 700;
            color: #fff;
        }
        .channel.active:hover {
            background-color: #8299e9;
        }
        .channel.unread::before {
            position: absolute;
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
            margin-right: 10px;
            left: -20px;
        }


        .chat {
            width: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .chat-messages {
            flex-grow: 1;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #2f3136;
            border-radius: 8px;
            overflow-y: auto;
            height: -webkit-fill-available;
        }
        .chat-messages .loading {
            width: 100%;
            height: 100%;
            overflow: hidden;
            align-items: center;
            justify-content: center;
            display: flex;
        }
        .chat-messages:has(.message) .loading {
            display: none;
        }
        .message {
            margin-bottom: 10px;
            max-width: 80%;
            width: fit-content;
            position: relative;
        }
        .message > .username {
            display: flex;
            align-items: center;
            font-size: 0.8em;
            color: #b9bbbe;
            margin-bottom: 5px;
            margin-left: 5px;
            margin-right: 5px;
        }
        .message > .username img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .message > .username .name {
            font-size: 16px;
            font-weight: 700;
            margin: 0px 5px;
            margin-top: -25px;
        }
        .message > .username .timestamp {
            font-size: 0.8em;
            color: #b9bbbe;
            margin-right: auto;
            letter-spacing: 0.1em; /* Adjust the value as needed */
            margin-top: -25px;
            margin-left: 5px;
        }
        .message > .content {
            margin-left: 65px;
            margin-top: -30px;
            padding: 8px;
            background-color: #40444b;
            border-radius: 4px;
            font-size: 1em;
            width: fit-content;
            overflow-wrap: anywhere;
        }
        
        body.setting-message-right .message.you {
            margin-left: auto;
        }
        body.setting-message-right .message.you .username {
            text-align: right;
            flex-direction: row-reverse;
        }
        body.setting-message-right .message.you .username img {
            margin-left: 5px;
            margin-right: 0;
        }
        
        body.setting-message-right .message.you .username .timestamp {
            margin-left: auto;
            margin-right: 5px;
        }
        body.setting-message-right .message.you .content {
            margin-right: 45px;
        }
        .message.you .content {
            background-color: #7289da;
        }
        .chat-bar {
            display: flex;
            align-items: center;
            background-color: #40444b;
            border-radius: 10px;
            overflow: hidden;
            align-items: center;
        }
        .chat-bar textarea {
            flex-grow: 1;
            padding: 20px 20px 20px 0px;
            border: none;
            background-color: #40444b;
            color: #fff;
            resize: none; /* Disable manual resizing */
            max-height: 40vh;
            overflow-y: auto; /* Enable vertical scrolling */
            font-size: 1em;
            line-height: 1.5em;
            display: flex;
            align-items: center; /* Center content vertically */
        }
        *::-webkit-scrollbar {
            width: 16px;
        }
        *::-webkit-scrollbar-thumb {
            background-color: #282b30;
            border-radius: 10px;
            border: 6px solid transparent; /* Added 2px transparent border */
            background-clip: padding-box; /* Ensures the border is outside the thumb */
        }
        *::-webkit-scrollbar-track {
            border-radius: 4px;
        }
        .chat-bar textarea:focus {
            outline: none;
        }
        .chat-bar .icon {
            margin: 10px;
            padding: 10px;
            cursor: pointer;
            display: flex;
        }
        .chat-bar > .icon img {
            width: 24px;
            height: 24px;
        }
        .users {
            width: 20%;
            background-color: #2f3136;
            display: flex;
            flex-direction: column;
        }
        .users h2 {
            margin: 0 0 20px 0;
            font-size: 1.2em;
            color: #b9bbbe;
        }
        .channel, .user {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #40444b;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #userList > .user {
            display: flex;
            justify-content: left;
            align-items: center;
        }
        #userList > .user.you {
            background-color: #7289da;
        }
        #userList > .user.you .name{
            font-weight: bold;
        }
        #userList .user > img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
        }
        #userList > .user .name {
            font-size: 1em;
        }

        #userList > .user.disconnected {
            opacity: 0.5;
        }

        .channel:hover, .user:hover {
            background-color: #50545c;
        }

        #main > div.users > div.banner {
            display: flex;
            flex-direction: row;
        }
        #main > div.users > div.banner h2 {
            flex: 1;
        }
        #main > div.users > div.banner .logout {
            color: #b9bbbe !important;
            cursor: pointer;
        }
    </style>
</head>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    const socket = io();

    const STORAGE_KEYS = {
        rememberedUserId: 'quickord.userId',
        temporaryUserId: 'quickord.tempUserId',
    };

    const isTemporarySession = new URLSearchParams(window.location.search).get('temporary') === '1';

    const state = {
        currentRoom: null,
        ownUserId: null,
        lastMessageUserId: null,
        shakeMessageInputUntil: 0,
        heartbeatTimer: null,
    };

    const dom = {
        loadingScreen: document.getElementById('loadingScreen'),
        main: document.getElementById('main'),
        loadingText: document.querySelector('#loadingScreen p'),
        textarea: document.querySelector('.chat-bar textarea'),
        channelList: document.querySelector('.channel-list'),
        chatMessages: document.querySelector('.chat-messages'),
        users: document.querySelector('#userList'),
    };

    const SVG = {
        channel_locked: `<svg class="icon__2ea32" aria-hidden="true" role="img" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M16 4h.5v-.5a2.5 2.5 0 0 1 5 0V4h.5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm4-.5V4h-2v-.5a1 1 0 1 1 2 0Z" clip-rule="evenodd"></path><path fill="currentColor" d="M12.5 8c.28 0 .5.22.5.5V9c0 .1 0 .2.02.31.03.34-.21.69-.56.69H9.85l-.67 4h4.97l.28-1.68c.06-.34.44-.52.77-.43a3 3 0 0 0 .8.11c.27 0 .47.24.43.5l-.25 1.5H20a1 1 0 1 1 0 2h-4.15l-.86 5.16a1 1 0 0 1-1.98-.32l.8-4.84H8.86l-.86 5.16A1 1 0 0 1 6 20.84L6.82 16H3a1 1 0 1 1 0-2h4.15l.67-4H4a1 1 0 1 1 0-2h4.15l.86-5.16a1 1 0 1 1 1.98.32L10.19 8h2.31Z"></path></svg>`,
        channel: `<svg class="icon__2ea32" aria-hidden="true" role="img" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M10.99 3.16A1 1 0 1 0 9 2.84L8.15 8H4a1 1 0 0 0 0 2h3.82l-.67 4H3a1 1 0 1 0 0 2h3.82l-.8 4.84a1 1 0 0 0 1.97.32L8.85 16h4.97l-.8 4.84a1 1 0 0 0 1.97.32l.86-5.16H20a1 1 0 1 0 0-2h-3.82l.67-4H21a1 1 0 1 0 0-2h-3.82l.8-4.84a1 1 0 1 0-1.97-.32L15.15 8h-4.97l.8-4.84ZM14.15 14l.67-4H9.85l-.67 4h4.97Z" clip-rule="evenodd"></path></svg>`
    };

    function getStoredUserId() {
        return sessionStorage.getItem(STORAGE_KEYS.temporaryUserId)
            || localStorage.getItem(STORAGE_KEYS.rememberedUserId)
            || null;
    }

    function setStoredUserId(userId, rememberMe) {
        if (rememberMe) {
            localStorage.setItem(STORAGE_KEYS.rememberedUserId, userId);
            sessionStorage.removeItem(STORAGE_KEYS.temporaryUserId);
        } else {
            sessionStorage.setItem(STORAGE_KEYS.temporaryUserId, userId);
            localStorage.removeItem(STORAGE_KEYS.rememberedUserId);
        }
    }

    function clearStoredSession() {
        localStorage.removeItem(STORAGE_KEYS.rememberedUserId);
        sessionStorage.removeItem(STORAGE_KEYS.temporaryUserId);
        localStorage.removeItem('user');
    }

    function redirectToLogin() {
        clearStoredSession();
        window.location.href = '/login';
    }

    function setLoadingText(text) {
        dom.loadingText.textContent = text;
    }

    function scrollChatToBottom() {
        dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
    }

    function startLoadingSentences() {
        const sentences = [
            'Powered by Quickord!',
            'Fast login, for quicker chat.',
        ];

        let index = 0;
        setInterval(() => {
            setLoadingText(sentences[index]);
            index = (index + 1) % sentences.length;
        }, 3000);
    }

    function formatTime(ms, format) {
        const units = {
            y: 31536000000,
            mo: 2628000000,
            d: 86400000,
            h: 3600000,
            m: 60000,
            s: 1000
        };

        const date = {};
        let rest = ms;

        date.years = Math.floor(rest / units.y); rest %= units.y;
        date.months = Math.floor(rest / units.mo); rest %= units.mo;
        date.days = Math.floor(rest / units.d); rest %= units.d;
        date.hours = Math.floor(rest / units.h); rest %= units.h;
        date.minutes = Math.floor(rest / units.m); rest %= units.m;
        date.seconds = Math.floor(rest / units.s); rest %= units.s;
        date.milliseconds = rest;

        date.all_days = Math.floor(ms / units.d);

        const pad = (n, l = 2) => String(n).padStart(l, "0");

        return format
            .replace("YYYY", date.years)
            .replace("MM", pad(date.months))
            .replace("DDDDD", date.all_days)
            .replace("DD", pad(date.days))
            .replace("hh", pad(date.hours))
            .replace("mm", pad(date.minutes))
            .replace("ss", pad(date.seconds))
            .replace("ms", pad(date.milliseconds, 3));
    }


    const loadingScreen = {
        show() {
            dom.loadingScreen.classList.remove('fade-out', 'hidden');
            dom.main.classList.add('hidden');
        },
        hide() {
            dom.main.classList.remove('hidden');
            dom.loadingScreen.classList.add('fade-out');
            setTimeout(() => {
                dom.loadingScreen.classList.add('hidden');
            }, 1000);
        }
    };

    class Cooldown {
        constructor(duration) {
            this.duration = duration;
            this.lastTime = 0;
        }

        use() {
            const now = Date.now();
            if (now - this.lastTime <= this.duration) return false;
            this.lastTime = now;
            return true;
        }
    }

    class UIController {
        constructor() {
            setInterval(() => {
                if (state.shakeMessageInputUntil !== 0 && state.shakeMessageInputUntil < Date.now()) {
                    dom.textarea.classList.remove('shake-animation');
                    state.shakeMessageInputUntil = 0;
                }
            }, 100);
        }

        shakeMessageInput(duration) {
            dom.textarea.classList.add('shake-animation');
            state.shakeMessageInputUntil = Date.now() + duration;
        }

        clearMessageInput() {
            dom.textarea.value = '';
            dom.textarea.style.height = 'auto';
        }

        clearMessageHistoryWithText(text) {
            dom.chatMessages.innerHTML = '';

            const loading = document.createElement('div');
            loading.classList.add('loading');

            const p = document.createElement('p');
            p.innerText = text;

            loading.appendChild(p);
            dom.chatMessages.appendChild(loading);
            state.lastMessageUserId = null;
        }

        clearMessageHistory() {
            this.clearMessageHistoryWithText('Loading messages ...');
        }

        clearMessageHistoryNoChannel() {
            this.clearMessageHistoryWithText('No channel selected');
        }

        createRoomElement(room) {
            const element = document.createElement('div');
            element.classList.add('channel', `room-${room.id}`);

            if (room.id === state.currentRoom) {
                element.classList.add('active');
            }

            element.onclick = () => APP.joinRoom(room.id);
            element.innerHTML = `
                <div class="icon">${SVG.channel}</div>
                <div class="name">${room.name}</div>
                <div class="members">${room.memberCount ?? '?'}</div>
            `;

            return element;
        }

        createUserElement(user) {
            const element = document.createElement('div');
            element.classList.add('user');
            element.classList.toggle('you', user.id === state.ownUserId);
            element.classList.toggle('disconnected', !user.connected);

            element.addEventListener("mouseenter", (event) => {
                if(event.target.classList.contains("disconnected")) {
                    element.title = `Disconnected ${formatTime(Date.now() - user.disconnectAt, 'mmm sss ago')}`
                } else if(event.target.classList.contains("you")) {
                    element.title = `Its you !`
                }
            })

            const img = document.createElement('img');
            img.src = user.avatarUrl ?? 'https://robohash.org/0';
            img.alt = user.username ?? 'Unknown User';

            const name = document.createElement('span');
            name.classList.add('name');
            name.textContent = user.username ?? 'Unknown User';

            element.appendChild(img);
            element.appendChild(name);

            return element;
        }

        parseContentToElements(text) {
            const elements = [];
            const lines = String(text ?? '').split('\n');
            const urlRegex = /(https?:\/\/[^\s]+)/g;

            for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
                const line = lines[lineIndex];
                const parts = line.split(urlRegex);

                for (const part of parts) {
                    if (urlRegex.test(part)) {
                        const a = document.createElement('a');
                        a.href = part;
                        a.textContent = part;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        elements.push(a);
                    } else {
                        const span = document.createElement('span');
                        span.textContent = part;
                        elements.push(span);
                    }
                }

                if (lineIndex < lines.length - 1) {
                    elements.push(document.createElement('br'));
                }
            }

            return elements;
        }

        addMessageToHistory(message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', `messageId-${message.id}`);

            const isOwnMessage = state.ownUserId == message.authorId;
            if (isOwnMessage) {
                messageElement.classList.add('you');
            }

            const usernameElement = document.createElement('div');
            usernameElement.classList.add('username');

            const userImageElement = document.createElement('img');
            userImageElement.src = message.authorAvatarUrl;
            userImageElement.alt = message.author;

            const userNameElement = document.createElement('span');
            userNameElement.classList.add('name');
            userNameElement.textContent = isOwnMessage ? 'You' : message.author;

            const timestampElement = document.createElement('span');
            timestampElement.classList.add('timestamp');

            const messageDate = new Date(message.timestamp);
            const today = new Date();
            const yesterday = new Date(Date.now() - 86400000);

            const dateLabel =
                today.toLocaleDateString() === messageDate.toLocaleDateString()
                    ? 'Today'
                    : yesterday.toLocaleDateString() === messageDate.toLocaleDateString()
                        ? 'Yesterday'
                        : messageDate.toLocaleDateString();

            timestampElement.textContent = `${dateLabel} - ${messageDate.toLocaleTimeString()}`;

            usernameElement.appendChild(userImageElement);
            usernameElement.appendChild(userNameElement);
            usernameElement.appendChild(timestampElement);

            if (state.lastMessageUserId === message.authorId && state.lastMessageUserId !== null) {
                usernameElement.style.display = 'none';
            }

            const contentElement = document.createElement('div');
            contentElement.classList.add('content');

            for (const node of this.parseContentToElements(message.content)) {
                contentElement.appendChild(node);
            }

            messageElement.appendChild(usernameElement);
            messageElement.appendChild(contentElement);
            dom.chatMessages.appendChild(messageElement);

            scrollChatToBottom();
            state.lastMessageUserId = message.authorId;
        }

        loadRooms(rooms) {
            dom.channelList.innerHTML = '';
            for (const room of rooms) {
                dom.channelList.appendChild(this.createRoomElement(room));
            }
        }

        selectRoom(roomId, retries = 10) {
            if (roomId == null) {
                console.error('[UI] Room ID is null');
                this.clearMessageHistoryNoChannel();
                return;
            }

            state.currentRoom = roomId;

            if (retries <= 0) {
                console.error('[UI] Failed to select room:', roomId);
                return;
            }

            try {
                dom.channelList.querySelectorAll('.channel').forEach(channel => {
                    channel.classList.remove('active');
                });

                const channel = dom.channelList.querySelector(`.room-${roomId}`);
                if (!channel) {
                    console.error('[UI] Room not found:', roomId);
                    return;
                }

                channel.classList.add('active');
                this.clearMessageHistory();
                socket.emit('getRoomHistory', roomId);
            } catch (error) {
                console.error('[UI] Error selecting room:', error);
                setTimeout(() => this.selectRoom(roomId, retries - 1), 100);
            }
        }

        loadHistory(history) {
            dom.chatMessages.innerHTML = '';
            for (const message of history) {
                this.addMessageToHistory(message);
            }
        }

        loadUsers(usersList) {
            dom.users.innerHTML = '';
            for (const user of usersList) {
                dom.users.appendChild(this.createUserElement(user));
            }
        }
    }

    class AppController {
        constructor() {
            this.cooldowns = {
                sendMessage: new Cooldown(1000),
            };
        }

        sendMessage() {
            const content = dom.textarea.value.trim();

            if (!content) {
                UI.shakeMessageInput(300);
                return;
            }

            if (!this.cooldowns.sendMessage.use()) {
                UI.shakeMessageInput(300);
                return;
            }

            UI.clearMessageInput();
            socket.emit('sendMessage', {
                content,
                attachments: [],
            });
        }

        receiveMessage(message) {
            UI.addMessageToHistory(message);
        }

        joinRoom(roomId) {
            socket.emit('joinRoom', roomId);
        }
    }

    const UI = new UIController();
    const APP = new AppController();

    function bindTextareaEvents() {
        dom.textarea.addEventListener('input', () => {
            dom.textarea.style.height = 'auto';
            dom.textarea.style.height = `${dom.textarea.scrollHeight}px`;
        });

        dom.textarea.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                APP.sendMessage();
            }
        });
    }

    function resumeSession() {
        const userId = getStoredUserId();

        if (!userId) {
            redirectToLogin();
            return;
        }

        socket.emit('resumeSession', { userId });
    }

    function startHeartbeat() {
        stopHeartbeat();

        state.heartbeatTimer = setInterval(() => {
            const userId = state.ownUserId || getStoredUserId();
            if (!userId) return;

            socket.emit('ping-ping', { userId });
        }, 5000);
    }

    function stopHeartbeat() {
        if (state.heartbeatTimer) {
            clearInterval(state.heartbeatTimer);
            state.heartbeatTimer = null;
        }
    }

    function syncSessionFromLogin(user) {
        state.ownUserId = user.userId;
        setStoredUserId(user.userId, !isTemporarySession);

        if (isTemporarySession) {
            window.history.pushState({}, document.title, '/');
        }

        startHeartbeat();
        loadingScreen.hide();
    }

    startLoadingSentences();
    bindTextareaEvents();

    window.addEventListener('load', () => {
        UI.clearMessageHistory();
        resumeSession();
    });

    socket.on('loginSuccess', (user) => {
        console.log('[socket:loginSuccess] Logged in as:', user);
        syncSessionFromLogin(user);
    });

    socket.on('loggedOut', (data) => {
        console.log('[socket:loggedOut] Logged out:', data);
        state.ownUserId = null;
        stopHeartbeat();
        redirectToLogin();
    });

    socket.on('roomList', (rooms) => {
        UI.loadRooms(rooms);

        if (state.currentRoom == null) {
            socket.emit('joinRoom', 'default');
        }
    });

    socket.on('userList', (users) => {
        UI.loadUsers(users);
    });

    socket.on('joinedRoom', (roomId) => {
        UI.selectRoom(roomId);
    });

    socket.on('roomHistory', (history) => {
        UI.loadHistory(history);
    });

    socket.on('message', (message) => {
        APP.receiveMessage(message);
    });

    socket.on('connect', () => {
        console.log('[socket:connect] Connected to server');
        socket.emit('getRooms');
        socket.emit('getUsers');
    });

    socket.on('disconnect', () => {
        stopHeartbeat();
    });

    socket.on('ping-ping', () => {
        // heartbeat acknowledged by server
    });

    socket.on('error', (error) => {
        console.error('[socket:error]', error);
    });
</script>
</body>
</html>
