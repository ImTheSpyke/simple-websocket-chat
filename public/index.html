<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #36393f;
        }

        .hidden {
            display: none !important;
        }

        .shake-animation {
            animation: shake 0.3s infinite;
            border: 2px solid #ff4d4d;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            50% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1000;
            background-color: #36393f;
        }
        #loadingScreen img {
            width: 128px;
            height: 128px;
            animation: rotate 2s ease-in-out infinite;
        }

        #loadingScreen.fade-out {
            animation: fadeOut 0.5s forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        #main {
            margin: 0;
            padding: 0;
            background-color: #36393f;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .channels, .chat, .users {
            padding: 15px;
            overflow-y: auto;
        }
        .channels {
            width: 20%;
            background-color: #2f3136;
            display: flex;
            flex-direction: column;
        }
        .channels h2 {
            margin: 0 0 20px 0;
            font-size: 1.2em;
            color: #b9bbbe;
        }
        .channel {
            display: flex;
            align-items: center;
            position: relative;
        }
        .channel > .name {
            font-size: 1em;
            font-weight: 700;
            flex:1;
        }
        .channel > .icon {
            margin-right: 6px;
        }
        .channel > .icon > svg {
            width: 20px;
            height: 20px;
        }

        .channel.active {
            background-color: #7289da;
            font-weight: 700;
            color: #fff;
        }
        .channel.active:hover {
            background-color: #8299e9;
        }
        .channel.unread::before {
            position: absolute;
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
            margin-right: 10px;
            left: -20px;
        }


        .chat {
            width: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .chat-messages {
            flex-grow: 1;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #2f3136;
            border-radius: 8px;
            overflow-y: auto;
            height: -webkit-fill-available;
        }
        .chat-messages .loading {
            width: 100%;
            height: 100%;
            overflow: hidden;
            align-items: center;
            justify-content: center;
            display: flex;
        }
        .chat-messages:has(.message) .loading {
            display: none;
        }
        .message {
            margin-bottom: 10px;
            max-width: 80%;
            width: fit-content;
            position: relative;
        }
        .message > .username {
            display: flex;
            align-items: center;
            font-size: 0.8em;
            color: #b9bbbe;
            margin-bottom: 5px;
            margin-left: 5px;
            margin-right: 5px;
        }
        .message > .username img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .message > .username .name {
            font-size: 16px;
            font-weight: 700;
            margin: 0px 5px;
            margin-top: -25px;
        }
        .message > .username .timestamp {
            font-size: 0.8em;
            color: #b9bbbe;
            margin-right: auto;
            letter-spacing: 0.1em; /* Adjust the value as needed */
            margin-top: -25px;
            margin-left: 5px;
        }
        .message > .content {
            margin-left: 65px;
            margin-top: -30px;
            padding: 8px;
            background-color: #40444b;
            border-radius: 4px;
            font-size: 1em;
            width: fit-content;
            overflow-wrap: anywhere;
        }
        
        body.setting-message-right .message.you {
            margin-left: auto;
        }
        body.setting-message-right .message.you .username {
            text-align: right;
            flex-direction: row-reverse;
        }
        body.setting-message-right .message.you .username img {
            margin-left: 5px;
            margin-right: 0;
        }
        
        body.setting-message-right .message.you .username .timestamp {
            margin-left: auto;
            margin-right: 5px;
        }
        body.setting-message-right .message.you .content {
            margin-right: 45px;
        }
        .message.you .content {
            background-color: #7289da;
        }
        .chat-bar {
            display: flex;
            align-items: center;
            background-color: #40444b;
            border-radius: 10px;
            overflow: hidden;
            align-items: center;
        }
        .chat-bar textarea {
            flex-grow: 1;
            padding: 20px 20px 20px 0px;
            border: none;
            background-color: #40444b;
            color: #fff;
            resize: none; /* Disable manual resizing */
            max-height: 40vh;
            overflow-y: auto; /* Enable vertical scrolling */
            font-size: 1em;
            line-height: 1.5em;
            display: flex;
            align-items: center; /* Center content vertically */
        }
        *::-webkit-scrollbar {
            width: 16px;
        }
        *::-webkit-scrollbar-thumb {
            background-color: #282b30;
            border-radius: 10px;
            border: 6px solid transparent; /* Added 2px transparent border */
            background-clip: padding-box; /* Ensures the border is outside the thumb */
        }
        *::-webkit-scrollbar-track {
            border-radius: 4px;
        }
        .chat-bar textarea:focus {
            outline: none;
        }
        .chat-bar .icon {
            margin: 10px;
            padding: 10px;
            cursor: pointer;
            display: flex;
        }
        .chat-bar > .icon img {
            width: 24px;
            height: 24px;
        }
        .users {
            width: 20%;
            background-color: #2f3136;
            display: flex;
            flex-direction: column;
        }
        .users h2 {
            margin: 0 0 20px 0;
            font-size: 1.2em;
            color: #b9bbbe;
        }
        .channel, .user {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #40444b;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #main > div.users > .user {
            display: flex;
            justify-content: left;
            align-items: center;
        }
        #main > div.users .user > img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
        }
        #main > div.users > .user .name {
            font-size: 1em;
        }
        .channel:hover, .user:hover {
            background-color: #50545c;
        }
    </style>
</head>

            /**
             * Generate a list of span and br elements from a text
             * @returns {HTMLElement[]}
             */
            _parseContentToElement(text) {
                const elements = [];
                const lines = text.split('\n');
                const urlRegex = /(https?:\/\/[^\s]+)/g;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const parts = line.split(urlRegex);

                    for (let j = 0; j < parts.length; j++) {
                        const part = parts[j];
                        if (urlRegex.test(part)) {
                            const a = document.createElement('a');
                            a.href = part;
                            a.textContent = part;
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                            elements.push(a);
                        } else {
                            const span = document.createElement('span');
                            span.textContent = part;
                            elements.push(span);
                        }
                    }

                    if (i < lines.length - 1) {
                        elements.push(document.createElement('br'));
                    }
                }
                return elements;
            }

                    // Username bar
                    const usernameElement = document.createElement('div');
                    usernameElement.classList.add('username');
                    // Avatar
                    const userImageElement = document.createElement('img');
                    userImageElement.src = message.authorAvatarUrl;
                    userImageElement.alt = message.author;
                    // Name
                    const userNameElement = document.createElement('span');
                    userNameElement.classList.add('name');
                    userNameElement.textContent = isOwn ? "You" : message.author;
                    // Timestamp
                    const timestampElement = document.createElement('span');
                    timestampElement.classList.add('timestamp');
                    // new Date(message.timestamp).toLocaleDateString(); (OR Today/Yesterday) - new Date(message.timestamp).toLocaleTimeString()
                    let _d = new Date(message.timestamp)
                    let _d_dateString = (new Date()).toLocaleDateString() == _d.toLocaleDateString() ? "Today" : (new Date(Date.now() - 86400000)).toLocaleDateString() == _d.toLocaleDateString() ? "Yesterday" : _d.toLocaleDateString()
                    let _d_timeString = _d.toLocaleTimeString()
                    timestampElement.textContent = `${_d_dateString} - ${_d_timeString}`;
                    
                    usernameElement.appendChild(userImageElement);
                    usernameElement.appendChild(userNameElement);
                    usernameElement.appendChild(timestampElement);
                    
                    if(that.TEMP.LAST_MESSAGE_USER_ID == message.authorId && that.TEMP.LAST_MESSAGE_USER_ID != null) {
                        usernameElement.style.display = 'none';
                    }
                    

                    // content
                    const contentElement = document.createElement('div');
                    contentElement.classList.add('content');
                    const parsedContent = that._parseContentToElement(message.content);
                    for (let i = 0; i < parsedContent.length; i++) {
                        contentElement.appendChild(parsedContent[i]);
                    }
                    messageElement.appendChild(usernameElement);
                    messageElement.appendChild(contentElement);
                    return messageElement;
                }

                const messageElement = createMessageElement(message);
                document.querySelector('.chat-messages').appendChild(messageElement);

                // Scroll to the bottom of the chat
                scrollChatToBottom();


                this.TEMP.LAST_MESSAGE_USER_ID = message.authorId;
                
            }

            loadRooms(rooms) {
                console.log(`[UI] Loading rooms:`, rooms);
                const channelListElem = document.querySelector('.channel-list')
                document.querySelector('.channel-list').innerHTML = ""
                rooms.forEach(room => {
                    let roomElement = this._createRoomElement(room)
                    channelListElem.appendChild(roomElement)
                });
            }

            selectRoom(roomId,retries=10) {
                if(roomId == null) {
                    console.error(`[UI] Room ID is null`);
                    UI.clearMessageHistory_noChannel()
                    return
                }
                _GLOBAL_TEMP_.CURRENT_ROOM = roomId
                if(retries <= 0) {
                    console.error(`[UI] Failed to select room:`, roomId);
                    return
                }
                try {
                    const channelListElem = document.querySelector('.channel-list')
                    channelListElem.querySelectorAll('.channel').forEach(channel => {
                        channel.classList.remove('active')
                    })
                    let channel = channelListElem.querySelector(`.room-${roomId}`)
                    if(!channel) {
                        console.error(`[UI] Room not found:`, roomId);
                        return
                    }
                    channel.classList.add('active')
                    this.clearMessageHistory()
                    socket.emit('getRoomHistory', roomId)
                } catch (error) {
                    console.error(`[UI] Error selecting room:`, error);
                    setTimeout(() => {
                        this.selectRoom(roomId,retries-1)
                    }, 100);
                }
            }
            loadHistory(history) {
                console.log(`[UI] Loading history:`, history);
                document.querySelector('.chat-messages').innerHTML = ""
                history.forEach(message => {
                    UI.addMessagetoHistory(message)
                });
            }

            loadUsers(users) {
                /*
                    Array<{
                        id: member.id,
                        username: member.username,
                        avatarUrl: member.avatarUrl,
                    }>
                  */
                console.log(`[UI] Loading users:`, users);
                const usersElem = document.querySelector('.users')
                usersElem.innerHTML = ""
                users.forEach(user => {
                    let userElement = this._createUserElement(user)
                    usersElem.appendChild(userElement)
                })
            }
        }

        const UI = new _UIFunctions();


        class Cooldown {
            constructor(duration) {
                this.duration = duration
                this.lastTime = 0
            }
            _canUse() {
                if (Date.now() - this.lastTime > this.duration) {
                    this.lastTime = Date.now()
                    return true
                } else {
                    return false
                }
            }
            use() {
                if (this._canUse()) {
                    return true
                } else {
                    return false
                }
            }
        }

        class _app {

            constructor() {
                this.Cooldowns = {
                    sendMessage: new Cooldown(1000)
                }
            }

            sendMessage() {
                const messageContent = textarea.value.trim();
                if (messageContent) {
                    if(this.Cooldowns.sendMessage.use() == false) {
                        UI.shakeMessageInput(300);
                        return
                    }
                    console.log(`[APP] Sending message:`, messageContent);
                    UI.clearMessageInput();
                    socket.emit('sendMessage', {
                        content: messageContent,
                        attachments: [],
                    })
                } else {
                    UI.shakeMessageInput(300);
                }
            }
            receiveMessage(message) {
                console.log(`[APP] Received message:`, message);
                UI.addMessagetoHistory(message)
            }

            joinRoom(roomId) {
                console.log(`[APP] Joining room:`, roomId);
                socket.emit('joinRoom', roomId)
            }
        }

        const APP = new _app();


        /* SOCKET */
        socket.on('loginSuccess', (user) => {
            /*
            user = {
                userId: user.id,
                username: user.username,
                expiresAt: user.expiresAt
            }
            */
            console.log(`[socket:loginSuccess] Logged in as:`, user);
            _GLOBAL_TEMP_.OWN_USER_ID = user.userId
            if(TEMPORARY_SESSION) {
                console.log(`[socket:loginSuccess] Temporary session, redirecting to /login`);
                localStorage.removeItem('user');
                window.history.pushState({}, document.title, "/")
            } else {
                localStorage.setItem('user', JSON.stringify(user));
            }
            loadingScreen.hide();
        });

        socket.on('loggedOut',(datas) => {
            /*
            datas= {
                reason: string
            }
                */
            console.log(`[socket:loggedOut] Logged out:`, datas);
            _GLOBAL_TEMP_.OWN_USER_ID = null
            localStorage.removeItem('user');
            window.location.href = '/login'
        })



        socket.on('roomList', (rooms) => {
            /*
            met rooms = Array<{
                ...
                memberCount: number
            }>
            */
            console.log(`[socket:roomList] Rooms:`, rooms);
            UI.loadRooms(rooms)
            UI.loadUsers(rooms.find(r => r.id == _GLOBAL_TEMP_.CURRENT_ROOM)?.members ?? [])
            if(_GLOBAL_TEMP_.CURRENT_ROOM == null) {
                socket.emit('joinRoom', 'default')
            }
        })

        socket.on('joinedRoom', (roomId) => {
            console.log(`[socket:joinedRoom]`, roomId);
            UI.selectRoom(roomId)
        })
        socket.on('roomHistory', (history) => {
            /*
            history = Array<{
                    content: string,
                    author: string,
                    authorId: string,
                    authorAvatarUrl: string,
                    timestamp: number
                    attachments: Array<Attachment>
                }>
            */
            console.log(`[socket:roomHistory]`, history);
            UI.loadHistory(history)
        })

        socket.on('message', (message) => {
            /*
            message = Message
            */
            console.log(`[socket:message]`, message);
            APP.receiveMessage(message)
        })

        socket.on('connect', () => {
            console.log(`[socket:connect] Connected to server`);
            socket.emit('getRooms')
        });

        socket.on('error', (error) => {
            console.error(`[socket:error]`, error);
        })

    </script>
</body>
</html>
